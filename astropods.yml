# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: blueprint/v1
name: "@sohumdalal/daily-wrap"

agent:
  build:
    context: .
    dockerfile: Dockerfile
  # Daily Wrap serves its own single-screen UI. No chat sidecar — declaring
  # `interfaces` at all flips messaging to false, so it is spelled out here.
  interfaces:
    frontend: true
    messaging: false
  healthcheck:
    path: /healthz
  inputs:
    - name: GITHUB_USERNAME
      datatype: string
      default: "sohumdalal"
      description: GitHub handle whose commits, PRs and reviews make up the day.
    - name: TIMEZONE
      datatype: string
      default: "America/New_York"
      description: >-
        IANA timezone that defines where one day ends and the next begins.
        Everything — Claude transcripts, GitHub queries, rollup boundaries — is
        bucketed against this, not UTC.
    - name: ANTHROPIC_MODEL
      datatype: string
      display-as: select
      options:
        - claude-opus-5
        - claude-sonnet-5
        - claude-haiku-4-5
      default: "claude-sonnet-5"
      description: Claude model that writes the wraps.
    - name: CLAUDE_HOME
      datatype: string
      optional: true
      description: >-
        Claude Code home directory to read the day out of. Defaults to
        `~/.claude`. The agent only ever reads from it.

models:
  # → ANTHROPIC_API_KEY
  anthropic:
    provider: anthropic

integrations:
  # → GITHUB_TOKEN
  github:
    provider: github

knowledge:
  # → POSTGRES_HOST / POSTGRES_PORT / POSTGRES_USER / POSTGRES_PASSWORD /
  #   POSTGRES_DB  (Postgres gets discrete fields, not a URL)
  #
  # Set this to "Shared" at deploy time and point it at a Postgres connected
  # under Knowledge > Add store. Then this laptop and the deployed agent are
  # reading and writing one database: the laptop collects the Claude Code half
  # of each day, which nothing in the cloud can reach, and the deployed agent
  # serves it. Left "Local", the platform provisions a private database and the
  # deployed copy sees no Claude activity at all.
  daily-wrap-db:
    provider: postgres

dev:
  interfaces:
    frontend:
      port: 3002
  command: bun --watch run start
