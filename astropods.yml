# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: blueprint/v1
name: "@sohum/daily-wrap"

agent:
  build:
    context: .
    dockerfile: Dockerfile
  # Daily Wrap serves its own single-screen UI. No chat sidecar — declaring
  # `interfaces` at all flips messaging to false, so it is spelled out here.
  interfaces:
    frontend: true
    messaging: false
  healthcheck:
    path: /healthz
  inputs:
    - name: GITHUB_USERNAME
      datatype: string
      default: "sohumdalal"
      description: GitHub handle whose commits, PRs and reviews make up the day.
    - name: TIMEZONE
      datatype: string
      default: "America/New_York"
      description: >-
        IANA timezone that defines where one day ends and the next begins.
        Everything — Claude transcripts, GitHub queries, rollup boundaries — is
        bucketed against this, not UTC.
    - name: ANTHROPIC_MODEL
      datatype: string
      display-as: select
      options:
        - claude-opus-5
        - claude-sonnet-5
        - claude-haiku-4-5
      default: "claude-sonnet-5"
      description: Claude model that writes the wraps.
    - name: POSTGRES_URL
      datatype: string
      secret: true
      optional: true
      description: >-
        Postgres connection string, which overrides the connection details the
        knowledge store injects. Set it to reach a database the platform did
        not provision, so this agent and a laptop collecting Claude Code
        activity share one record. Leave empty to use the declared store.
    - name: CLAUDE_HOME
      datatype: string
      optional: true
      description: >-
        Claude Code home directory to read the day out of. Defaults to
        `~/.claude`. The agent only ever reads from it.

models:
  # → ANTHROPIC_API_KEY
  anthropic:
    provider: anthropic

integrations:
  # → GITHUB_TOKEN
  github:
    provider: github

knowledge:
  daily-wrap-db:
    provider: postgres

dev:
  interfaces:
    frontend:
      port: 3002
  command: bun --watch run start
