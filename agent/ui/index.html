<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Wrap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <nav class="topnav">
      <span class="wordmark">Daily Wrap</span>
      <div class="nav-right">
        <div class="periods" id="periods">
          <button data-period="day" aria-current="true">Day</button>
          <button data-period="week">Week</button>
          <button data-period="month">Month</button>
          <button data-period="year">Year</button>
        </div>
        <input
          class="datepick"
          type="date"
          id="datepick"
          aria-label="Jump to a date"
          title="Jump to a date"
        />
        <button class="today-jump" id="today-jump" title="Today's reflection (T)">
          Today
        </button>
      </div>
    </nav>

    <main class="shell" id="shell">
      <!-- The day in numbers is the top of the page. -->
      <header class="hero">
        <div class="hero-date">
          <div class="stepper">
            <button id="prev" title="Previous (←)">&larr;</button>
            <button id="next" title="Next (→)">&rarr;</button>
          </div>
          <span class="label" id="date-label"></span>
          <span class="badge" id="today-badge" hidden>Today</span>
        </div>
      </header>

      <!-- Four spec cells. Numbers are the brand's display treatment. -->
      <section class="specs" id="specs" hidden></section>

      <hr class="rule" id="specs-rule" hidden />

      <p class="hero-empty" id="empty" hidden>Nothing wrapped yet.</p>

      <section class="section" id="did-section" hidden>
        <div class="section-head"><span class="label">What you did</span></div>
        <ul class="bullets" id="did"></ul>
      </section>

      <!-- The agent's read, then yours. These two are the point of the record,
           so they sit together and are saved together. -->
      <section class="section" id="learned-section" hidden>
        <div class="section-head">
          <span class="label">What you learned</span>
          <button class="disagree" id="disagree">Disagree</button>
        </div>
        <p class="take" id="learned"></p>

        <div class="dispute" id="dispute" hidden>
          <textarea
            id="dispute-note"
            placeholder="What did it get wrong about you? This is kept and applied to every wrap from here on."
          ></textarea>
          <div class="dispute-actions">
            <button class="btn" id="dispute-send">Send &amp; rewrite</button>
            <button class="btn outline" id="dispute-cancel">Cancel</button>
          </div>
        </div>

        <div class="corrections" id="corrections" hidden>
          <span class="label">Corrections you've given</span>
          <ul class="bullets quiet" id="corrections-list"></ul>
        </div>
      </section>
      <section class="section">
        <div class="section-head"><span class="label" id="reflection-label">Reflection</span></div>
        <textarea
          id="reflection"
          placeholder="What actually happened today?"
          spellcheck="true"
        ></textarea>
        <div class="energy">
          <span class="label">Energy</span>
          <div class="energy-scale" id="energy">
            <button data-energy="1" aria-pressed="false">1</button>
            <button data-energy="2" aria-pressed="false">2</button>
            <button data-energy="3" aria-pressed="false">3</button>
            <button data-energy="4" aria-pressed="false">4</button>
            <button data-energy="5" aria-pressed="false">5</button>
          </div>
          <span class="caption" id="saved"></span>
        </div>
      </section>

      <section class="section growth" id="grew-section" hidden>
        <div class="section-head"><span class="label">Where you grew</span></div>
        <ul class="bullets" id="grew"></ul>
      </section>

      <!-- Rollups list the days beneath them instead of spec cells. -->
      <section class="section" id="covered-section" hidden>
        <div class="section-head"><span class="label">Days in this period</span></div>
        <div class="covered" id="covered"></div>
      </section>

      <!-- Derived from collected data, never from model output: every row is a
           real URL. Slack threads join this list when that integration lands. -->
      <section class="section" id="sources-section" hidden>
        <div class="section-head">
          <span class="label">Sources</span>
          <span class="caption" id="sources-count"></span>
        </div>
        <div class="sources" id="sources"></div>
      </section>


      <div class="actions">
        <button class="btn" id="wrap">Wrap the day</button>
        <button class="btn outline" id="collect">Refresh sources</button>
      </div>

      <p class="note" id="note" hidden></p>
      <p class="caption" id="provenance" hidden></p>

      <div class="keys">
        <span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> move</span>
        <span><kbd>D</kbd> <kbd>W</kbd> <kbd>M</kbd> <kbd>Y</kbd> period</span>
        <span><kbd>&#9166;</kbd> wrap</span>
        <span><kbd>R</kbd> reflect</span>
        <span><kbd>T</kbd> today</span>
      </div>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
